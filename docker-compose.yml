version: "3.8"
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: prisma
      POSTGRES_PASSWORD: prisma
      POSTGRES_DB: smartbin
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    command: sh -c "npm run prisma:generate && npm run prisma:migrate:deploy && npm run start:prod"
    environment:
      DATABASE_URL: "postgresql://prisma:prisma@db:5432/smartbin?schema=public"
      PORT: 3001
    depends_on:
      - db
    ports:
      - "3001:3001"
      - "5555:5555"   # <--- ย้ายมาที่ backend ที่ถูกต้อง

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: "http://backend:3001"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db-data:
